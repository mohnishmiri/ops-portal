# ============================================================
# Azure Ops Portal — Plugin Registry & Extensibility Guide
# ============================================================
# This file documents the plugin system and how to create
# new plugins for the Ops Intelligence Portal.
# ============================================================

plugins:
  # Built-in plugins shipped with the portal
  builtin:
    - name: aks_insights
      version: "1.0.0"
      description: "AKS cluster and node pool operational intelligence"
      routes_prefix: /api/v1/plugins/aks
      dashboards:
        - name: AKS Cluster Overview
          widget_type: table
      required_permissions:
        - cost:read

    - name: keyvault_ops
      version: "1.0.0"
      description: "Key Vault secret lifecycle management"
      routes_prefix: /api/v1/plugins/keyvault
      dashboards:
        - name: Secret Inventory
          widget_type: table
      required_permissions:
        - cost:read     # list/search
        - cost:admin    # view secret values

  # Template for creating a custom plugin
  custom_template:
    name: my_custom_plugin
    version: "0.1.0"
    description: "Template for custom plugin development"
    routes_prefix: /api/v1/plugins/my-custom
    dashboards:
      - name: Custom Dashboard Widget
        widget_type: chart  # chart | table | metric | list
    required_permissions:
      - cost:read

