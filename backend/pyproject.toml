[project]
name = "azure-ops-portal"
version = "1.3.0"
description = "Azure Ops Intelligence & Optimization Portal - FastAPI Backend"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "ATTCC Platform Engineering"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "azure-identity>=1.17.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-advisor>=9.0.0",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-storage>=21.0.0",
    "azure-mgmt-network>=25.0.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-mgmt-keyvault>=10.3.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-mgmt-containerservice>=30.0.0",
    "azure-mgmt-resourcegraph>=8.0.0",
    "azure-mgmt-synapse>=2.0.0",
    "azure-synapse-artifacts>=0.18.0",
    "azure-mgmt-rdbms>=10.0.0",
    "azure-storage-blob>=12.19.0",
    "httpx>=0.27.0",
    # Direct dependency: PKCS#12 re-wrapping for escrowed PFX downloads.
    # Also used for pure-Python JKS generation (Keyfactor has no JKS export).
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "apscheduler>=3.10.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "tenacity>=8.3.0",
    "kubernetes>=29.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["B904", "E501", "RET504", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/endpoints/*.py" = ["B008"]
"app/auth/*.py" = ["B008"]
"app/core/authz.py" = ["B008"]
"app/core/subscription_scope.py" = ["B008"]
"app/plugins/**/*.py" = ["B008"]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
native-tls = true

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-pptx>=1.0.2",
]
