apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ops-portal.fullname" . }}-frontend-nginx
  labels:
    app.kubernetes.io/name: {{ include "ops-portal.name" . }}
    app.kubernetes.io/component: frontend
data:
  app.conf.template: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        set $opsportal_forwarded_proto $scheme;
        if ($http_x_forwarded_proto != "") {
            set $opsportal_forwarded_proto $http_x_forwarded_proto;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass ${BACKEND_UPSTREAM}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opsportal_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://login.microsoftonline.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://login.microsoftonline.com https://*.azure.com" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }