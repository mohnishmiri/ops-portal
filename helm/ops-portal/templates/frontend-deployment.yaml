apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ops-portal.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "ops-portal.name" . }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ops-portal.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      {{- if .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml .Values.frontend.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "ops-portal.name" . }}
        app.kubernetes.io/component: frontend
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: false  # NGINX requires root in default config
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image.repository }}:{{ default .Chart.AppVersion .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: BACKEND_UPSTREAM
              value: "http://{{ include "ops-portal.fullname" . }}-backend:{{ .Values.backend.service.port }}"
            {{- if .Values.frontend.azureKeyVaultSecrets.enabled }}
            {{- range .Values.frontend.azureKeyVaultSecrets.items }}
            {{- if not (hasKey $.Values.frontend.env .envName) }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .kubernetesSecretName }}
                  key: {{ default .envName .dataKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.frontend.env }}
            {{- range $key, $val := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/app.conf.template
              subPath: app.conf.template
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "ops-portal.fullname" . }}-frontend-nginx
