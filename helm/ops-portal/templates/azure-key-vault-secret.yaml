{{- if .Values.backend.azureKeyVaultSecrets.enabled }}
{{- include "ops-portal.akvsValidateSkips" (dict "cfg" .Values.backend.azureKeyVaultSecrets "path" "backend.azureKeyVaultSecrets") }}
{{- range .Values.backend.azureKeyVaultSecrets.items }}
{{- if include "ops-portal.akvsItemEnabled" (dict "cfg" $.Values.backend.azureKeyVaultSecrets "item" .) }}
---
apiVersion: spv.no/v2beta1
kind: AzureKeyVaultSecret
metadata:
  name: {{ printf "%s-sync" .kubernetesSecretName | trunc 63 | trimSuffix "-" }}
spec:
  vault:
    name: {{ $.Values.backend.azureKeyVaultSecrets.vaultName | quote }}
    object:
      name: {{ .akvSecretName | quote }}
      type: {{ default "secret" .objectType | quote }}
      {{- if .objectVersion }}
      version: {{ .objectVersion | quote }}
      {{- end }}
  output:
    secret:
      name: {{ .kubernetesSecretName | quote }}
      {{- $secretType := default "Opaque" .secretType }}
      type: {{ $secretType | quote }}
      {{- if eq (lower $secretType) "opaque" }}
      dataKey: {{ default .envName .dataKey | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.frontend.azureKeyVaultSecrets.enabled }}
{{- include "ops-portal.akvsValidateSkips" (dict "cfg" .Values.frontend.azureKeyVaultSecrets "path" "frontend.azureKeyVaultSecrets") }}
{{- range .Values.frontend.azureKeyVaultSecrets.items }}
{{- if include "ops-portal.akvsItemEnabled" (dict "cfg" $.Values.frontend.azureKeyVaultSecrets "item" .) }}
---
apiVersion: spv.no/v2beta1
kind: AzureKeyVaultSecret
metadata:
  name: {{ printf "%s-sync" .kubernetesSecretName | trunc 63 | trimSuffix "-" }}
spec:
  vault:
    name: {{ $.Values.frontend.azureKeyVaultSecrets.vaultName | quote }}
    object:
      name: {{ .akvSecretName | quote }}
      type: {{ default "secret" .objectType | quote }}
      {{- if .objectVersion }}
      version: {{ .objectVersion | quote }}
      {{- end }}
  output:
    secret:
      name: {{ .kubernetesSecretName | quote }}
      {{- $secretType := default "Opaque" .secretType }}
      type: {{ $secretType | quote }}
      {{- if eq (lower $secretType) "opaque" }}
      dataKey: {{ default .envName .dataKey | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.ingress.azureKeyVaultCertificates.enabled }}
{{- range .Values.ingress.azureKeyVaultCertificates.items }}
---
apiVersion: spv.no/v2beta1
kind: AzureKeyVaultSecret
metadata:
  name: {{ printf "%s-sync" .kubernetesSecretName | trunc 63 | trimSuffix "-" }}
spec:
  vault:
    name: {{ $.Values.ingress.azureKeyVaultCertificates.vaultName | quote }}
    object:
      name: {{ .akvCertificateName | quote }}
      type: {{ default "certificate" .objectType | quote }}
      {{- if .objectVersion }}
      version: {{ .objectVersion | quote }}
      {{- end }}
  output:
    secret:
      name: {{ .kubernetesSecretName | quote }}
      type: "kubernetes.io/tls"
      {{- if .chainOrder }}
      chainOrder: {{ .chainOrder | quote }}
      {{- end }}
{{- end }}
{{- end }}