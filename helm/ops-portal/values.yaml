# ============================================================
# Azure Ops Portal — Helm Chart Values
# ============================================================

global:
  environment: production
  imageRegistry: ""  # e.g., myacr.azurecr.io or artifact.it.att.com/apm0014313-dkr-attcc-stage/com.att.attcc
  imagePullSecrets: 
    - name: regcred  # Kubernetes Secret for pulling from private registry

# ── Backend ────────────────────────────────────────────────────

backend:
  replicaCount: 2

  podAnnotations: {}

  image:
    repository: ops-portal-backend
    tag: ""  # Defaults to Chart.appVersion when not overridden
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  # Plain (non-secret) backend config. Rendered after the Key Vault-backed env
  # below, so a key set here wins over a synced secret of the same name.
  env:
    # ── Certificate private-key escrow ──
    # Keyfactor releases a PFX only at issuance, so without escrow a certificate
    # can be loaded into exactly one Key Vault and never again. Point this at a
    # dedicated escrow vault (not a vault certificates are deployed into); the
    # backend's workload identity needs secrets get/set/delete on it. Escrow
    # stays off unless both values are set — see docs/CERTIFICATE_MANAGEMENT.md.
    CERT_KEY_ESCROW_ENABLED: "false"
    CERT_KEY_ESCROW_VAULT: ""
    # Full escrow vault URI. Overrides CERT_KEY_ESCROW_VAULT; only needed when
    # the vault is not at https://<name>.vault.azure.net (e.g. sovereign clouds).
    CERT_KEY_ESCROW_VAULT_URI: ""

    # ── Portal URL for email links ──
    # Access-request/approval emails, alert and certificate reports link here.
    # Unset, the chart uses https://<first ingress host> — which CI sets per
    # environment — see templates/backend-deployment.yaml. Set it only when the
    # public URL differs from the ingress host.
    # PORTAL_BASE_URL: "https://<portal-host>"

    # ── Entra app role values ──
    # Must match the App Role values in the app registration. Super Admin is
    # granted in Entra only (docs/PROJECT_ACCESS.md).
    ROLE_SUPER_ADMIN: "OpsPortal.SuperAdmin"
    ROLE_ADMIN: "OpsPortal.Admin"
    ROLE_WRITE: "OpsPortal.Write"
    ROLE_READ: "OpsPortal.Read"

    # ── Safety ──
    # Never true in a deployed environment; the backend refuses to start with
    # DEV_AUTH_BYPASS on outside ENVIRONMENT=development.
    DEBUG: "false"
    DEV_AUTH_BYPASS: "false"

    # ── Notifications ──
    # JSON list of addresses for budget / platform notifications.
    NOTIFICATION_RECIPIENTS: '["ARISTOS-AO-EUGENE-COMM-INFRA@accenture.com"]'

    # ── Tuning (values shown are the backend defaults) ──
    # Connections per pod: DB_POOL_SIZE + DB_MAX_OVERFLOW. Multiply by the
    # replica count and keep it under the PostgreSQL max_connections.
    DB_POOL_SIZE: "100"
    DB_MAX_OVERFLOW: "50"
    DB_POOL_RECYCLE: "1800"
    DB_POOL_TIMEOUT: "30"
    CACHE_TTL_SECONDS: "3600"
    REPORT_CACHE_TTL: "86400"
    K8S_DASHBOARD_PROXY_TIMEOUT: "30"
    KEYFACTOR_LIST_CACHE_TTL: "60"
    AZURE_PRICING_API_URL: "https://prices.azure.com/api/retail/prices"
    AZURE_PRICING_TIMEOUT_SECONDS: "10"
    AZURE_PRICING_CURRENCY_CODE: "USD"
    # Empty = https://login.microsoftonline.com/<AZURE_TENANT_ID>
    AZURE_AUTHORITY: ""

  # akv2k8s sync: one AzureKeyVaultSecret per item, wired into the backend env.
  # When the vault doesn't hold a secret, or this project doesn't use the
  # feature, skip it instead of deleting the item. A skipped item gets no
  # AzureKeyVaultSecret and no secretKeyRef, so nothing looks for the secret
  # and the app falls back to its default (or to backend.env):
  #   skipGroups: [agentLlm, keyfactor]  # whole optional feature, by `group:`
  #                                      # (ollama, agentLlm, k8sDashboard, keyfactor)
  #   skip: [SMTP_PASSWORD]              # single items, by envName
  # `enabled: false` on an item also skips it; `enabled: false` here turns the
  # whole sync off. Unknown names in skip/skipGroups fail the render.
  azureKeyVaultSecrets:
    enabled: false
    vaultName: ""
    skipGroups: []
    skip: []
    items:
      - envName: ENVIRONMENT
        akvSecretName: opsportal-backend-environment
        kubernetesSecretName: ops-portal-backend-environment
      - envName: LOG_LEVEL
        akvSecretName: opsportal-backend-log-level
        kubernetesSecretName: ops-portal-backend-log-level
      - envName: AZURE_TENANT_ID
        akvSecretName: opsportal-backend-azure-tenant-id
        kubernetesSecretName: ops-portal-backend-azure-tenant-id
      - envName: AZURE_CLIENT_ID
        akvSecretName: opsportal-backend-azure-client-id
        kubernetesSecretName: ops-portal-backend-azure-client-id
      - envName: AZURE_CLIENT_SECRET
        akvSecretName: opsportal-backend-azure-client-secret
        kubernetesSecretName: ops-portal-backend-azure-client-secret
      - envName: AZURE_SUBSCRIPTION_IDS
        akvSecretName: opsportal-backend-azure-subscription-ids
        kubernetesSecretName: ops-portal-backend-azure-subscription-ids
      - envName: DATABASE_URL
        akvSecretName: opsportal-backend-database-url
        kubernetesSecretName: ops-portal-backend-database-url
      - envName: DB_ECHO
        akvSecretName: opsportal-backend-db-echo
        kubernetesSecretName: ops-portal-backend-db-echo
      - envName: SMTP_HOST
        akvSecretName: opsportal-backend-smtp-host
        kubernetesSecretName: ops-portal-backend-smtp-host
      - envName: SMTP_PORT
        akvSecretName: opsportal-backend-smtp-port
        kubernetesSecretName: ops-portal-backend-smtp-port
      - envName: SMTP_USER
        akvSecretName: opsportal-backend-smtp-user
        kubernetesSecretName: ops-portal-backend-smtp-user
      - envName: SMTP_PASSWORD
        akvSecretName: opsportal-backend-smtp-password
        kubernetesSecretName: ops-portal-backend-smtp-password
      - envName: SMTP_FROM_ADDRESS
        akvSecretName: opsportal-backend-smtp-from-address
        kubernetesSecretName: ops-portal-backend-smtp-from-address
      - envName: SMTP_USE_TLS
        akvSecretName: opsportal-backend-smtp-use-tls
        kubernetesSecretName: ops-portal-backend-smtp-use-tls
      - envName: KEYVAULT_URL
        akvSecretName: opsportal-backend-keyvault-url
        kubernetesSecretName: ops-portal-backend-keyvault-url
      - envName: CORS_ORIGINS
        akvSecretName: opsportal-backend-cors-origins
        kubernetesSecretName: ops-portal-backend-cors-origins
      - envName: RATE_LIMIT_RPM
        akvSecretName: opsportal-backend-rate-limit-rpm
        kubernetesSecretName: ops-portal-backend-rate-limit-rpm
      - envName: OLLAMA_BASE_URL
        akvSecretName: opsportal-backend-ollama-base-url
        kubernetesSecretName: ops-portal-backend-ollama-base-url
        optional: true
        group: ollama
      - envName: OLLAMA_MODEL
        akvSecretName: opsportal-backend-ollama-model
        kubernetesSecretName: ops-portal-backend-ollama-model
        optional: true
        group: ollama
      - envName: OLLAMA_TIMEOUT_SECONDS
        akvSecretName: opsportal-backend-ollama-timeout-seconds
        kubernetesSecretName: ops-portal-backend-ollama-timeout-seconds
        optional: true
        group: ollama
      - envName: OLLAMA_AUTH_HEADER_NAME
        akvSecretName: opsportal-backend-ollama-auth-header-name
        kubernetesSecretName: ops-portal-backend-ollama-auth-header-name
        optional: true
        group: ollama
      - envName: OLLAMA_AUTH_HEADER_VALUE
        akvSecretName: opsportal-backend-ollama-auth-header-value
        kubernetesSecretName: ops-portal-backend-ollama-auth-header-value
        optional: true
        group: ollama
      # ── Agent assistant LLM (separate endpoint from the Leadership advisor) ──
      - envName: AGENT_LLM_BASE_URL
        akvSecretName: opsportal-backend-agent-llm-base-url
        kubernetesSecretName: ops-portal-backend-agent-llm-base-url
        optional: true
        group: agentLlm
      - envName: AGENT_LLM_MODEL
        akvSecretName: opsportal-backend-agent-llm-model
        kubernetesSecretName: ops-portal-backend-agent-llm-model
        optional: true
        group: agentLlm
      - envName: AGENT_LLM_TIMEOUT_SECONDS
        akvSecretName: opsportal-backend-agent-llm-timeout-seconds
        kubernetesSecretName: ops-portal-backend-agent-llm-timeout-seconds
        optional: true
        group: agentLlm
      - envName: AGENT_LLM_AUTH_HEADER_NAME
        akvSecretName: opsportal-backend-agent-llm-auth-header-name
        kubernetesSecretName: ops-portal-backend-agent-llm-auth-header-name
        optional: true
        group: agentLlm
      - envName: AGENT_LLM_AUTH_HEADER_VALUE
        akvSecretName: opsportal-backend-agent-llm-auth-header-value
        kubernetesSecretName: ops-portal-backend-agent-llm-auth-header-value
        optional: true
        group: agentLlm
      - envName: K8S_DASHBOARD_TOKEN_PROD
        akvSecretName: opsportal-backend-k8s-dashboard-token-prod
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-prod
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_TOKEN_PREPROD
        akvSecretName: opsportal-backend-k8s-dashboard-token-preprod
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-preprod
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_TOKEN_PERF
        akvSecretName: opsportal-backend-k8s-dashboard-token-perf
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-perf
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_TOKEN_UAT
        akvSecretName: opsportal-backend-k8s-dashboard-token-uat
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-uat
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_TOKEN_DEV
        akvSecretName: opsportal-backend-k8s-dashboard-token-dev
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-dev
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_TOKEN_DR
        akvSecretName: opsportal-backend-k8s-dashboard-token-dr
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-token-dr
        optional: true
        group: k8sDashboard
      - envName: K8S_DASHBOARD_SESSION_SECRET
        akvSecretName: opsportal-backend-k8s-dashboard-session-secret
        kubernetesSecretName: ops-portal-backend-k8s-dashboard-session-secret
        optional: true
        group: k8sDashboard
      # ── Keyfactor Command (Certificate Management) ──
      - envName: KEYFACTOR_BASE_URL
        akvSecretName: opsportal-backend-keyfactor-base-url
        kubernetesSecretName: ops-portal-backend-keyfactor-base-url
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_TENANT_ID
        akvSecretName: opsportal-backend-keyfactor-tenant-id
        kubernetesSecretName: ops-portal-backend-keyfactor-tenant-id
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_CLIENT_ID
        akvSecretName: opsportal-backend-keyfactor-client-id
        kubernetesSecretName: ops-portal-backend-keyfactor-client-id
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_CLIENT_SECRET
        akvSecretName: opsportal-backend-keyfactor-client-secret
        kubernetesSecretName: ops-portal-backend-keyfactor-client-secret
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_OAUTH_SCOPE
        akvSecretName: opsportal-backend-keyfactor-oauth-scope
        kubernetesSecretName: ops-portal-backend-keyfactor-oauth-scope
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_API_VERSION
        akvSecretName: opsportal-backend-keyfactor-api-version
        kubernetesSecretName: ops-portal-backend-keyfactor-api-version
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_TIMEOUT_SECONDS
        akvSecretName: opsportal-backend-keyfactor-timeout-seconds
        kubernetesSecretName: ops-portal-backend-keyfactor-timeout-seconds
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_VERIFY_SSL
        akvSecretName: opsportal-backend-keyfactor-verify-ssl
        kubernetesSecretName: ops-portal-backend-keyfactor-verify-ssl
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_DEFAULT_CA
        akvSecretName: opsportal-backend-keyfactor-default-ca
        kubernetesSecretName: ops-portal-backend-keyfactor-default-ca
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_DEFAULT_TEMPLATE
        akvSecretName: opsportal-backend-keyfactor-default-template
        kubernetesSecretName: ops-portal-backend-keyfactor-default-template
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_ENROLLMENT_PATTERNS
        akvSecretName: opsportal-backend-keyfactor-enrollment-patterns
        kubernetesSecretName: ops-portal-backend-keyfactor-enrollment-patterns
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_TOKEN_URL
        akvSecretName: opsportal-backend-keyfactor-token-url
        kubernetesSecretName: ops-portal-backend-keyfactor-token-url
        optional: true
        group: keyfactor
      - envName: KEYFACTOR_CA_BUNDLE
        akvSecretName: opsportal-backend-keyfactor-ca-bundle
        kubernetesSecretName: ops-portal-backend-keyfactor-ca-bundle
        optional: true
        group: keyfactor

  # Legacy CSI-based sync path. Prefer AzureKeyVaultSecret below when akv2k8s is installed.
  secretProvider:
    enabled: false
    keyvaultName: ""  # Your Azure Key Vault name
    tenantId: ""
    clientId: ""      # Managed Identity client ID
    secrets:
      - name: AZURE_TENANT_ID
        key: azure-tenant-id
      - name: AZURE_CLIENT_ID
        key: azure-client-id
      - name: AZURE_SUBSCRIPTION_IDS
        key: azure-subscription-ids
      - name: DATABASE_URL
        key: database-url
      - name: KEYVAULT_URL
        key: keyvault-url

  probes:
    liveness:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /readyz
      port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10

  serviceAccount:
    create: true
    annotations:
      azure.workload.identity/client-id: ""  # Managed Identity Client ID

  podLabels:
    azure.workload.identity/use: "true"

# ── Frontend ───────────────────────────────────────────────────

frontend:
  replicaCount: 2

  podAnnotations: {}

  image:
    repository: ops-portal-frontend
    tag: ""  # Defaults to Chart.appVersion when not overridden
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  env: {}

  azureKeyVaultSecrets:
    enabled: false
    vaultName: ""
    items:
      - envName: VITE_AZURE_CLIENT_ID
        akvSecretName: opsportal-frontend-azure-client-id
        kubernetesSecretName: ops-portal-frontend-azure-client-id
      - envName: VITE_AZURE_TENANT_ID
        akvSecretName: opsportal-frontend-azure-tenant-id
        kubernetesSecretName: ops-portal-frontend-azure-tenant-id
      - envName: VITE_REDIRECT_URI
        akvSecretName: opsportal-frontend-redirect-uri
        kubernetesSecretName: ops-portal-frontend-redirect-uri
      - envName: VITE_API_BASE_URL
        akvSecretName: opsportal-frontend-api-base-url
        kubernetesSecretName: ops-portal-frontend-api-base-url

# ── Ingress ────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    #nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    #nginx.ingress.kubernetes.io/rate-limit-rps: "20"
  hosts:
    - host: attccopsportal.stage.att.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  azureKeyVaultCertificates:
    enabled: false
    vaultName: ""
    items:
      - akvCertificateName: opsportal-ingress-tls
        kubernetesSecretName: ops-portal-tls
        #chainOrder: ensureserverfirst
  tls:
    - secretName: ops-portal-tls
      hosts:
        - attccopsportal.stage.att.com

# ── Redis ──────────────────────────────────────────────────────

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# ── Network Policy ─────────────────────────────────────────────

networkPolicy:
  enabled: true
