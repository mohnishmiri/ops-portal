[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migration-intake"
version = "0.1.0"
description = "AWS Outposts Migration Intake Application"
readme = "README.md"
license = {text = "Proprietary - All Rights Reserved"}
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Migration Architecture Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13.0,<2.0",
    "jinja2>=3.1.4,<4.0",
    "openpyxl>=3.1.2,<4.0",
    "httpx>=0.27.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "oracledb>=2.2.0,<3.0",
    "packaging>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "ruff>=0.4.0,<1.0",
    "types-openpyxl>=3.1.0,<4.0",
]
browser = [
    "playwright>=1.44.0,<2.0",
    "pytest-playwright>=0.5.0,<1.0",
]

[project.scripts]
migration-intake = "migration_intake.main:run"
migration-intake-bootstrap-catalog = "migration_intake.catalog.bootstrap:main"
migration-intake-catalog-maintenance = "migration_intake.catalog.bootstrap:maintenance_main"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_intake"]
force-include = { "src/migration_intake/catalog/data/catalog-1.0.0.csv" = "migration_intake/catalog/data/catalog-1.0.0.csv", "src/migration_intake/topology/config/slot_bindings.json" = "migration_intake/topology/config/slot_bindings.json", "src/migration_intake/topology/profiles/synthetic_label_only/manifest.json" = "migration_intake/topology/profiles/synthetic_label_only/manifest.json", "src/migration_intake/topology/profiles/synthetic_label_only/slots.json" = "migration_intake/topology/profiles/synthetic_label_only/slots.json", "src/migration_intake/topology/profiles/synthetic_label_only/mappings.json" = "migration_intake/topology/profiles/synthetic_label_only/mappings.json", "src/migration_intake/topology/profiles/synthetic_label_only/markers.json" = "migration_intake/topology/profiles/synthetic_label_only/markers.json", "src/migration_intake/topology/profiles/synthetic_label_only/issue_rules.json" = "migration_intake/topology/profiles/synthetic_label_only/issue_rules.json", "src/migration_intake/topology/profiles/synthetic_label_only/naming_rules.json" = "migration_intake/topology/profiles/synthetic_label_only/naming_rules.json", "src/migration_intake/topology/profiles/synthetic_structural/manifest.json" = "migration_intake/topology/profiles/synthetic_structural/manifest.json", "src/migration_intake/topology/profiles/synthetic_structural/slots.json" = "migration_intake/topology/profiles/synthetic_structural/slots.json", "src/migration_intake/topology/profiles/synthetic_structural/mappings.json" = "migration_intake/topology/profiles/synthetic_structural/mappings.json", "src/migration_intake/topology/profiles/synthetic_structural/markers.json" = "migration_intake/topology/profiles/synthetic_structural/markers.json", "src/migration_intake/topology/profiles/synthetic_structural/issue_rules.json" = "migration_intake/topology/profiles/synthetic_structural/issue_rules.json", "src/migration_intake/topology/profiles/synthetic_structural/naming_rules.json" = "migration_intake/topology/profiles/synthetic_structural/naming_rules.json" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (database, filesystem)",
    "web: Web/HTTP tests",
    "browser: Browser/Playwright tests",
    "oracle: Tests requiring Oracle database",
    "slow: Tests that take more than 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:Exception ignored while finalizing database connection:pytest.PytestUnraisableExceptionWarning",
    "ignore:unclosed database:ResourceWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "oracledb.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "S101",   # assert used (OK in tests)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]
"tests/unit/topology/test_*.py" = ["E501", "S105", "S106"]
"tests/integration/test_catalog_bootstrap.py" = ["TC003"]

[tool.ruff.lint.isort]
known-first-party = ["migration_intake"]

[tool.coverage.run]
source = ["src/migration_intake"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
