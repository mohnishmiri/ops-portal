name: Migration Intake - CD (Deploy to AKS)
run-name: "Migration Intake CD: deploy ${{ inputs.version }} to perf"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image and chart version to deploy
        required: true
        type: string
      authentication:
        description: RevUp authentication ID
        default: undef
        required: true
        type: string
      invoked_by:
        description: Invoking workflow
        default: undef
        required: false
        type: string
      run_id:
        description: Parent workflow run ID
        default: ""
        required: false
        type: string
      dora_unique_id:
        description: DORA correlation ID
        default: ""
        required: false
        type: string
      perf:
        description: Deploy to perf
        default: true
        required: false
        type: boolean

permissions:
  id-token: write
  contents: read
  attestations: read

env:
  revup_iebus_secret: ${{ secrets.REVUP_EVENTING_SECRET }}

jobs:
  info:
    name: Deployment information
    runs-on:
      group: apm0014313-runner-group-primary
      labels:
        - apm0014313-runner-group-primary
        - 40ff645c-df8e-4f2b-bf1a-408d82a89c05
    steps:
      - name: Display deployment metadata
        env:
          VERSION: ${{ inputs.version }}
          INVOKED_BY: ${{ inputs.invoked_by }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Deploying Migration Intake version %s (invoked by %s)\n' "${VERSION}" "${INVOKED_BY}"
          printf 'Parent run: https://github.com/${{ github.repository }}/actions/runs/%s\n' "${RUN_ID}"

  perf:
    name: Deploy and verify - Perf
    if: ${{ inputs.perf }}
    needs: info
    environment: perf
    runs-on:
      group: apm0014313-runner-group-primary
      labels:
        - apm0014313-runner-group-primary
        - 40ff645c-df8e-4f2b-bf1a-408d82a89c05
    steps:
      - name: Deploy to AKS
        uses: ATT-IDP/revup-deployment-aks@v3
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          auth_mode: managed_identity
          environment: perf
          version: ${{ inputs.version }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Report DORA deployment
        uses: ATT-IDP/revup-teamup-dora@v3
        with:
          version: ${{ inputs.version }}
          report_type: deploy
          environment_name: perf
          dora_unique_id: ${{ inputs.dora_unique_id }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}