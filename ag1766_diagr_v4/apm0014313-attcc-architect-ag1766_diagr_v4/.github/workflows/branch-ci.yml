name: Migration Intake - CI (Validate, Build, Publish)
run-name: "Migration Intake CI: ${{ github.event_name }} on ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      enable_deployment:
        description: Deploy the published version to perf
        default: false
        required: true
        type: boolean
      run_ruff:
        description: Run Ruff linting
        default: true
        required: false
        type: boolean
      run_mypy:
        description: Run mypy type checking
        default: true
        required: false
        type: boolean
      run_tests:
        description: Run pytest tests
        default: true
        required: false
        type: boolean
      log_level:
        description: Log level
        default: info
        required: true
        type: choice
        options:
          - info
          - debug
  pull_request:

env:
  PIP_INDEX_URL: https://${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@artifact.it.att.com/artifactory/api/pypi/apm0014313-pyp-group/simple
  # The builder base image has no CA bundle, so the index host must be trusted explicitly.
  PIP_TRUSTED_HOST: artifact.it.att.com

jobs:
  metadata:
    name: Checkout and metadata
    if: >-
      ${{ (github.event_name == 'pull_request') ||
          (github.event_name == 'workflow_dispatch') }}
    runs-on: concordia-linux-cpu4-ram14gi
    outputs:
      commit-sha: ${{ steps.metadata.outputs.commit-sha }}
      short-sha: ${{ steps.metadata.outputs.short-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit-sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'short-sha=%s\n' "${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Lint, type check, test, and validate
    runs-on: concordia-linux-cpu4-ram14gi
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml

      - name: Run Ruff
        if: ${{ github.event_name == 'pull_request' || inputs.run_ruff }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="HEAD"
          fi

          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "${base_ref}"...HEAD -- src tests \
              | grep -E '\.py$' || true
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi

          python -m ruff check "${python_files[@]}"

      - name: Run mypy
        if: ${{ github.event_name == 'pull_request' || inputs.run_mypy }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="HEAD"
          fi

          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "${base_ref}"...HEAD \
              -- src/migration_intake \
              | grep -E '\.py$' || true
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed application Python files to type-check."
            exit 0
          fi

          python -m mypy --config-file pyproject.toml --follow-imports=silent \
            "${python_files[@]}"

      - name: Run tests
        if: ${{ github.event_name == 'pull_request' || inputs.run_tests }}
        run: python -m pytest tests --ignore=tests/browser

      - name: Compile Python sources
        run: python -m compileall -q src/migration_intake tests

      - name: Validate YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          patterns = (
              ".github/**/*.yaml",
              ".github/**/*.yml",
              "helm/Chart.yaml",
              "helm/values.yaml",
              "helm/envs/*.yaml",
              "docker-compose.yml",
          )
          for pattern in patterns:
              for path in Path(".").glob(pattern):
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  print(f"valid: {path}")
          PY

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.18.6

      - name: Lint and render Helm chart
        run: |
          helm lint ./helm --values ./helm/envs/perf.yaml
          helm template migration-intake ./helm --namespace migration-intake --values ./helm/envs/perf.yaml > /dev/null

  secret-scan:
    name: Secret scanning
    runs-on: concordia-linux-cpu4-ram14gi
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          disallowed="$(find . -name '.env*' ! -name '.env.example' ! -name '.env.docker.example' ! -name '.env.local.example' ! -path './.git/*')"
          if [[ -n "${disallowed}" ]]; then
            printf 'Disallowed environment files:\n%s\n' "${disallowed}"
            exit 1
          fi

  docker-validate:
    name: Docker build validation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: concordia-linux-cpu4-ram14gi
    needs:
      - metadata
      - quality
      - secret-scan
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Build image without publishing
        uses: ATT-IDP/revup-docker-build@v3
        with:
          checkout: "true"
          build_only: "true"
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          buildkit_secrets: |
            pip_index_url=PIP_INDEX_URL
            pip_trusted_host=PIP_TRUSTED_HOST

  docker-build:
    name: Docker build, scan, and publish
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: concordia-linux-cpu4-ram14gi
    needs:
      - metadata
      - quality
      - secret-scan
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    outputs:
      build_version: ${{ steps.build.outputs.build_version }}
    steps:
      - name: Build and publish image
        id: build
        uses: ATT-IDP/revup-docker-build@v3
        with:
          checkout: "true"
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          buildkit_secrets: |
            pip_index_url=PIP_INDEX_URL
            pip_trusted_host=PIP_TRUSTED_HOST

  charts:
    name: Build and publish Helm chart
    runs-on: concordia-linux-cpu4-ram14gi
    needs: docker-build
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Publish chart
        uses: ATT-IDP/revup-helm-charts@v3
        with:
          standalone_chart: "true"
          version: ${{ needs.docker-build.outputs.build_version }}
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}

  trigger-deployment:
    name: Trigger perf deployment
    if: ${{ inputs.enable_deployment && needs.charts.result == 'success' }}
    runs-on: concordia-linux-cpu4-ram14gi
    needs:
      - docker-build
      - charts
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag and trigger deployment
        uses: ATT-IDP/revup-trigger-deployment@v3
        with:
          authentication_id: ${{ secrets.AUTHENTICATION_ID }}
          version: ${{ needs.docker-build.outputs.build_version }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}