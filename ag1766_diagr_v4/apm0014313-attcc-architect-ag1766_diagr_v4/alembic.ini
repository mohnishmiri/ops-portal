# Alembic configuration for Migration Intake application.
#
# DATABASE credentials are NEVER stored here.
# The sqlalchemy.url below is an intentional placeholder that is always
# overridden by env.py, which reads AWS_OUTPOST_DATABASE_URL from the environment.
#
# Usage:
#   export AWS_OUTPOST_DATABASE_URL=sqlite:///path/to/app.db
#   alembic upgrade head

[alembic]
script_location = src/migration_intake/persistence/migrations

# Intentional placeholder — env.py overrides this from AWS_OUTPOST_DATABASE_URL.
sqlalchemy.url =

# Custom file template that embeds date, time, revision id, and slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated migration timestamps.
timezone = UTC

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Output encoding.
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
